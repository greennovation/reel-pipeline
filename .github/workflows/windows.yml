name: Windows

# Приёмочный контур для Windows-порта движка: реальной Windows-машины у нас
# нет, поэтому GitHub Actions windows-latest — единственная живая проверка,
# что pytest зелёный на Windows, а не только в предположениях.
on:
  push:
    branches: [main, windows-порт]
  pull_request:
  workflow_dispatch:

jobs:
  pytest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Статический билд с GitHub-релизов BtbN: choco community feed дважды
      # за один день (21.08.2026) отдавал 504 и ронял прогон, GitHub-релизы
      # из Actions качаются надёжно. Билд GPL включает zscale (zimg).
      - name: Установить ffmpeg
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath $env:RUNNER_TEMP\ffmpeg
          $bin = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Directory -Filter bin | Select-Object -First 1
          Add-Content $env:GITHUB_PATH $bin.FullName

      - name: Проверить ffmpeg
        run: ffmpeg -version

      - name: Установить зависимости Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Проверить окружение (pipeline_check.py)
        run: python pipeline_check.py
        continue-on-error: true  # whisper и ассеты не входят в репозиторий — это ожидаемо

      - name: pytest
        run: python -m pytest -q
