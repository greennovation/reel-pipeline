name: Windows

# Приёмочный контур для Windows-порта движка: реальной Windows-машины у нас
# нет, поэтому GitHub Actions windows-latest — единственная живая проверка,
# что pytest зелёный на Windows, а не только в предположениях.
on:
  push:
    branches: [main, windows-порт]
  pull_request:
  workflow_dispatch:

jobs:
  pytest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # choco стабильнее winget в Actions: winget в образах windows-latest
      # периодически недоступен без интерактивной первичной настройки.
      # Ретраи: community-feed choco временами отдаёт 504 и при этом choco
      # выходит нулём с «installed 0/0 packages» (живой случай 21.08.2026),
      # поэтому успех меряем наличием ffmpeg в PATH, а не кодом выхода.
      - name: Установить ffmpeg
        run: |
          $ok = $false
          foreach ($i in 1..3) {
            choco install ffmpeg -y --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { $ok = $true; break }
            Write-Host "ffmpeg не появился после попытки $i, жду и повторяю"
            Start-Sleep -Seconds 30
          }
          if (-not $ok) { Write-Error "ffmpeg не установился за 3 попытки"; exit 1 }

      - name: Проверить ffmpeg
        run: ffmpeg -version

      - name: Установить зависимости Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Проверить окружение (pipeline_check.py)
        run: python pipeline_check.py
        continue-on-error: true  # whisper и ассеты не входят в репозиторий — это ожидаемо

      - name: pytest
        run: python -m pytest -q
